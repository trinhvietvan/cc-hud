    <text x="132" y="168" xml:space="preserve"><tspan fill-opacity="0"><animate attributeName="fill-opacity" values="0;0;1;1;0" keyTimes="0;0.070;0.110;0.93;1" dur="7s" repeatCount="indefinite"/><tspan>🤖 </tspan><tspan fill="#89b4fa">GLM 5.2</tspan><tspan fill="#6c7086"> · </tspan><tspan fill="#cdd6f4">1M</tspan></tspan><tspan fill="#6c7086"> | </tspan><tspan fill-opacity="0"><animate attributeName="fill-opacity" values="0;0;1;1;0" keyTimes="0;0.120;0.160;0.93;1" dur="7s" repeatCount="indefinite"/><tspan>⚡ </tspan><tspan fill="#cdd6f4">Ctx </tspan><tspan fill="#a6e3a1">41%</tspan><tspan fill="#6c7086"> · </tspan><tspan fill="#cdd6f4">410k tokens</tspan></tspan><tspan fill="#6c7086"> | </tspan><tspan fill-opacity="0"><animate attributeName="fill-opacity" values="0;0;1;1;0" keyTimes="0;0.170;0.210;0.93;1" dur="7s" repeatCount="indefinite"/><tspan>🧩 </tspan><tspan fill="#94e2d5">explore</tspan><tspan fill="#6c7086"> (haiku)</tspan></tspan><tspan fill="#6c7086"> | </tspan><tspan fill-opacity="0"><animate attributeName="fill-opacity" values="0;0;1;1;0" keyTimes="0;0.220;0.260;0.93;1" dur="7s" repeatCount="indefinite"/><tspan>💰 </tspan><tspan fill="#94e2d5">¥88.50</tspan></tspan></text>
    <text x="48" y="198" fill="#7f849c" font-weight="500">DeepSeek</text>
    <text x="132" y="198" xml:space="preserve"><tspan fill-opacity="0"><animate attributeName="fill-opacity" values="0;0;1;1;0" keyTimes="0;0.110;0.150;0.93;1" dur="7s" repeatCount="indefinite"/><tspan>🤖 </tspan><tspan fill="#89b4fa">DeepSeek V4 Pro</tspan><tspan fill="#6c7086"> · </tspan><tspan fill="#cdd6f4">1M</tspan></tspan><tspan fill="#6c7086"> | </tspan><tspan fill-opacity="0"><animate attributeName="fill-opacity" values="0;0;1;1;0" keyTimes="0;0.160;0.200;0.93;1" dur="7s" repeatCount="indefinite"/><tspan>⚡ </tspan><tspan fill="#cdd6f4">Ctx </tspan><tspan fill="#a6e3a1">20%</tspan><tspan fill="#6c7086"> · </tspan><tspan fill="#cdd6f4">200k tokens</tspan></tspan><tspan fill="#6c7086"> | </tspan><tspan fill-opacity="0"><animate attributeName="fill-opacity" values="0;0;1;1;0" keyTimes="0;0.210;0.250;0.93;1" dur="7s" repeatCount="indefinite"/><tspan>💰 </tspan><tspan fill="#94e2d5">¥13.44</tspan></tspan></text>
    <text x="48" y="228" fill="#7f849c" font-weight="500">MiniMax</text>
    <text x="132" y="228" xml:space="preserve"><tspan fill-opacity="0"><animate attributeName="fill-opacity" values="0;0;1;1;0" keyTimes="0;0.150;0.190;0.93;1" dur="7s" repeatCount="indefinite"/><tspan>🤖 </tspan><tspan fill="#89b4fa">MiniMax M3</tspan></tspan><tspan fill="#6c7086"> | </tspan><tspan fill-opacity="0"><animate attributeName="fill-opacity" values="0;0;1;1;0" keyTimes="0;0.200;0.240;0.93;1" dur="7s" repeatCount="indefinite"/><tspan>⚡ </tspan><tspan fill="#cdd6f4">Ctx </tspan><tspan fill="#f9e2af">63%</tspan><tspan fill="#6c7086"> · </tspan><tspan fill="#cdd6f4">126k tokens</tspan></tspan><tspan fill="#6c7086"> | </tspan><tspan fill-opacity="0"><animate attributeName="fill-opacity" values="0;0;1;1;0" keyTimes="0;0.250;0.290;0.93;1" dur="7s" repeatCount="indefinite"/><tspan>🔥 </tspan><tspan fill="#cdd6f4">Usage </tspan><tspan fill="#a6e3a1">17%</tspan><tspan fill="#6c7086"> · </tspan><tspan fill="#6c7086">Rs </tspan><tspan fill="#f2cdcd">18:50</tspan></tspan><tspan fill="#6c7086"> | </tspan><tspan fill-opacity="0"><animate attributeName="fill-opacity" values="0;0;1;1;0" keyTimes="0;0.300;0.340;0.93;1" dur="7s" repeatCount="indefinite"/><tspan>⚙️ </tspan><tspan fill="#cdd6f4">Weekly </tspan><tspan fill="#a6e3a1">2%</tspan><tspan fill="#6c7086"> · </tspan><tspan fill="#6c7086">Rs </tspan><tspan fill="#74c7ec">10-Oct 09:00</tspan></tspan></text>
  </g>

  <!-- Footer -->
  <g font-size="12" fill="#585b70">
    <line x1="48" y1="268" x2="1152" y2="268" stroke="#313244" stroke-dasharray="3 3"/>
    <text x="48" y="290" xml:space="preserve"><tspan fill="#94e2d5">●</tspan> zero dependencies   <tspan fill="#94e2d5">●</tspan> pure Node.js   <tspan fill="#94e2d5">●</tspan> crash-free on Windows   <tspan fill="#94e2d5">●</tspan> 144 tests   <tspan fill="#94e2d5">●</tspan> stable-path launcher</text>
  </g>

</svg>
