<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" font-family="ui-monospace, 'SF Mono', Menlo, 'Cascadia Mono', Consolas, monospace">
  <title>cc-hud — Claude Code statusline</title>
  <desc>Animated preview of cc-hud v0.9.0: model · variant | thinking depth | Ctx % · tokens | Usage (5h) · reset time | Weekly (7d) · reset date | git branch, plus subagents and balance, across Claude, GLM, DeepSeek, MiniMax. Segments type in left to right, a heartbeat dot pulses once per loop.</desc>

  <defs>
    <linearGradient id="titleBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#181825"/>
      <stop offset="1" stop-color="#11111b"/>
    </linearGradient>
    <filter id="termShadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Terminal window -->
  <g filter="url(#termShadow)">
    <rect x="24" y="24" width="1152" height="282" rx="14" fill="#1e1e2e" stroke="#313244"/>
    <path d="M24 38 a14 14 0 0 1 14-14 h1124 a14 14 0 0 1 14 14 v22 h-1152 z" fill="url(#titleBg)"/>
    <line x1="24" y1="60" x2="1176" y2="60" stroke="#313244"/>

    <circle cx="44" cy="42" r="6" fill="#f38ba8"/>
    <circle cx="62" cy="42" r="6" fill="#f9e2af"/>
    <circle cx="80" cy="42" r="6" fill="#a6e3a1"/>

    <!-- Title text — `cc-hud` brand color shimmers between purple shades. -->
    <text x="600" y="46" font-size="12" fill="#7f849c" text-anchor="middle" font-weight="500" letter-spacing="0.5"><tspan fill="#cba6f7" font-weight="600">cc-hud<animate attributeName="fill" values="#cba6f7;#e8d4ff;#cba6f7" dur="4s" repeatCount="indefinite"/></tspan> · claude code statusline</text>

    <!-- Heartbeat dot — pulses bright green once per loop, signalling "live". -->
    <circle cx="1080" cy="42" r="3" fill="#a6e3a1" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0.6;0" keyTimes="0;0.92;0.95;0.98;1" dur="7s" repeatCount="indefinite"/>
    </circle>

    <rect x="1100" y="33" width="60" height="18" rx="9" fill="none" stroke="#313244"/>
    <text x="1130" y="46" font-size="10.5" fill="#585b70" text-anchor="middle" letter-spacing="0.7">v0.9.0</text>
  </g>

  <!-- Subtitle -->
  <text x="48" y="94" font-size="12" font-style="italic" fill="#585b70">CC-HUD v0.9.0 — <tspan fill="#cba6f7" font-weight="600" font-style="normal">git branch</tspan> · model · thinking depth · context + tokens · rate limits with reset time</text>

  <!-- Body rows -->
  <g font-size="13">
    <text x="48" y="138" fill="#7f849c" font-weight="500">Claude</text>
    <text x="132" y="138" xml:space="preserve"><tspan fill-opacity="0"><animate attributeName="fill-opacity" values="0;0;1;1;0" keyTimes="0;0.030;0.070;0.93;1" dur="7s" repeatCount="indefinite"/><tspan>🤖 </tspan><tspan fill="#89b4fa">Opus 5.5</tspan><tspan fill="#6c7086"> · </tspan><tspan fill="#cdd6f4">1M</tspan></tspan><tspan fill="#6c7086"> | </tspan><tspan fill-opacity="0"><animate attributeName="fill-opacity" values="0;0;1;1;0" keyTimes="0;0.080;0.120;0.93;1" dur="7s" repeatCount="indefinite"/><tspan>🧠 </tspan><tspan fill="#cdd6f4">High</tspan></tspan><tspan fill="#6c7086"> | </tspan><tspan fill-opacity="0"><animate attributeName="fill-opacity" values="0;0;1;1;0" keyTimes="0;0.130;0.170;0.93;1" dur="7s" repeatCount="indefinite"/><tspan>⚡ </tspan><tspan fill="#cdd6f4">Ctx </tspan><tspan fill="#a6e3a1">50%</tspan><tspan fill="#6c7086"> · </tspan><tspan fill="#cdd6f4">500k tokens</tspan></tspan><tspan fill="#6c7086"> | </tspan><tspan fill-opacity="0"><animate attributeName="fill-opacity" values="0;0;1;1;0" keyTimes="0;0.180;0.220;0.93;1" dur="7s" repeatCount="indefinite"/><tspan>🔥 </tspan><tspan fill="#cdd6f4">Usage </tspan><tspan fill="#a6e3a1">12%</tspan><tspan fill="#6c7086"> · </tspan><tspan fill="#6c7086">Rs </tspan><tspan fill="#b4befe">21:30</tspan></tspan><tspan fill="#6c7086"> | </tspan><tspan fill-opacity="0"><animate attributeName="fill-opacity" values="0;0;1;1;0" keyTimes="0;0.230;0.270;0.93;1" dur="7s" repeatCount="indefinite"/><tspan>⚙️ </tspan><tspan fill="#cdd6f4">Weekly </tspan><tspan fill="#a6e3a1">40%</tspan><tspan fill="#6c7086"> · </tspan><tspan fill="#6c7086">Rs </tspan><tspan fill="#74c7ec">08-Oct 21:30</tspan></tspan><tspan fill="#6c7086"> | </tspan><tspan fill-opacity="0"><animate attributeName="fill-opacity" values="0;0;1;1;0" keyTimes="0;0.280;0.320;0.93;1" dur="7s" repeatCount="indefinite"/><tspan>🌿 </tspan><tspan fill="#6c7086">git </tspan><tspan fill="#cba6f7">main</tspan></tspan></text>
